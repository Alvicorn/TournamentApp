name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/staging-')
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      # Render pulls the repo, runs `pnpm build`, and publishes dist/ itself
      # (build settings + VITE_* env live on the Render static site). CI only
      # gates the deploy on green tests. Auto-deploy is disabled in Render.
      - name: Trigger Render deploy
        run: curl -fsS "$RENDER_DEPLOY_HOOK_FRONTEND" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          VITE_API_URL:               ${{ secrets.VITE_API_URL }}
          VITE_VAPID_PUBLIC_KEY:      ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
