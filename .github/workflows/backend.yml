name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"


jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install deps
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Clock convention check
        run: uv run python -m app.lint.clock_convention

      - name: Unit + BDD tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/tournament_test"
          JUDGE_JWT_SECRET: "test-secret"
          ADMIN_EMAIL_ALLOWLIST: "admin@test.com"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_KEY: "placeholder-key"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tournament_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/staging-')
    needs: lint-test
    runs-on: ubuntu-latest

    steps:
      - name: Create .env
        run: |
          echo "ADMIN_EMAIL_ALLOWLIST=${{ secrets.ADMIN_EMAIL_ALLOWLIST }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "JUDGE_JWT_SECRET=${{ secrets.JUDGE_JWT_SECRET }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env

      # Render pulls the repo and builds the Docker image itself; CI only
      # gates the deploy on green tests. Auto-deploy is disabled in Render.
      - name: Trigger Render deploy
        run: curl -fsS "$RENDER_DEPLOY_HOOK_BACKEND" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
