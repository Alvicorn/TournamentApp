[project]
name = "tournament-app-backend"
version = "0.1.0"
description = "FastAPI backend for the martial arts tournament app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "supabase>=2.0,<2.10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.1",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.5",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Fix Alembic dynamic imports / op module issues
[[tool.mypy.overrides]]
module = "alembic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
