# Render blueprint — declares both services so setup is reproducible.
# Deploys are triggered by CI via deploy hooks (autoDeploy: false), so nothing
# ships without green tests. See docs/deployment.md.

services:
  - type: web
    name: tournament-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # upgrade to `starter` for event months if desired
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JUDGE_JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL_ALLOWLIST
        sync: false

  - type: web
    name: tournament-frontend
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      # SPA fallback: client-side router owns all paths
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
